apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab7-deployer
  namespace: lab7
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab7-deployer
  namespace: lab7
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab7-deployer
  namespace: lab7
subjects:
  - kind: ServiceAccount
    name: lab7-deployer
    namespace: lab7
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab7-deployer
