name: lab4-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            lab4/requirements.txt
            lab4/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r lab4/requirements.txt -r lab4/requirements-dev.txt

      - name: Run tests
        working-directory: lab4
        run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate image tag
        id: meta
        run: echo "image-tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: lab4
          load: true
          tags: acs730-lab4:${{ steps.meta.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: |
          docker save "acs730-lab4:${{ steps.meta.outputs.image-tag }}" -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab4-image
          path: image.tar
          retention-days: 1

  smoke:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: lab4-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Test container
        env:
          TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          docker run -d --name app -p 8000:8000 "acs730-lab4:$TAG"

          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/healthz; then
              exit 0
            fi
            sleep 2
          done

          docker logs app
          exit 1

  summary:
    needs: [test, build, smoke, publish]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Report results
        run: |
          echo "Test: ${{ needs.test.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Build: ${{ needs.build.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Smoke: ${{ needs.smoke.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Publish: ${{ needs.publish.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag: ${{ needs.build.outputs.image-tag }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Re-raise upstream failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  publish:
    needs: [test, build, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lab4-image

      - name: Load image
        run: docker load -i image.tar

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          TAG="sha-${GITHUB_SHA::12}"
          IMAGE="ghcr.io/$OWNER/acs730-lab4:$TAG"
          docker tag "acs730-lab4:$TAG" "$IMAGE"
          docker push "$IMAGE"
