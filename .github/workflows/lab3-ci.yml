name: lab3-ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every shell script must parse
        run: |
          set -euo pipefail
          for f in $(find lab3 -name '*.sh'); do
            echo "checking $f"
            bash -n "$f"
          done

                - name: Test missing AWS_REGION is rejected
        run: |
          set -euo pipefail
          if output=$(env -u AWS_REGION bash lab3/scripts/check-env.sh 2>&1); then
            printf '%s\n' "$output"
            echo "ERROR: check-env.sh accepted a missing AWS_REGION"
            exit 1
          fi
          printf '%s\n' "$output"
          grep -q "AWS_REGION is not set" <<< "$output"
