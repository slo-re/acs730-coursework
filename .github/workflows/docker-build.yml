name: docker-build

on:
  workflow_call:
    inputs:
      context:
        required: true
        type: string
      image-name:
        required: true
        type: string
      push:
        required: false
        type: boolean
        default: false
    outputs:
      image-ref:
        description: Full Docker image reference
        value: ${{ jobs.build.outputs.image-ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-ref: ${{ steps.image.outputs.ref }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate image reference
        id: image
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=ghcr.io/${OWNER}/${{ inputs.image-name }}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
